[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readingpaper-skills"
version = "0.1.0"
description = "ChatGPT Skills for academic paper reading, related literature discovery, and synthesis."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
yaml = [
  "PyYAML>=6",
]
dotenv = [
  "python-dotenv>=1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["skills*"]
exclude = ["tests*", "schemas*", "tools*", "finalpaper*"]
